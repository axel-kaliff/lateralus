name: Sync fork with upstream

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v5
        with:
          fetch-depth: 0

      - name: Sync from upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # .gitattributes marks Containerfile merge=ours: our copy always wins
          # (we intentionally diverge from upstream's base image and dnf setup).
          git config merge.ours.driver true
          git remote add upstream https://github.com/projectbluefin/finpilot.git
          git fetch upstream main

          if git merge upstream/main --no-edit; then
            if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
              git push
              echo "Synced successfully with upstream."
            else
              echo "Already up to date."
            fi
            exit 0
          fi

          git merge --abort
          echo "::error::Merge conflict syncing from projectbluefin/finpilot — resolve manually."

          # Open a tracking issue unless one is already open. Issue creation is
          # best-effort (repo may have issues disabled); the run still fails so
          # the conflict is visible either way.
          existing=$(gh issue list --state open --search "Upstream sync failed in:title" \
            --json number --jq 'length' 2>/dev/null || echo 0)
          if [ "${existing}" = "0" ]; then
            gh issue create \
              --title "Upstream sync failed: merge conflict" \
              --body "Automatic merge from \`projectbluefin/finpilot\` main failed due to conflicts. Resolve locally: \`git fetch upstream && git merge upstream/main\`, fix conflicts, push to main." \
              || echo "Could not create issue (issues may be disabled)."
          fi
          exit 1
