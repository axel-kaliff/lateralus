# Omarchy v4 login flow: SDDM's greeter is rendered by Hyprland itself.
# Verbatim from omarchy's etc/sddm.conf.d/10-wayland.conf, relocated to
# /usr/lib (vendor config — /etc is user-owned state on ostree).
# start-hyprland is shipped by the hyprland-no-session package.
[General]
DisplayServer=wayland

[Wayland]
CompositorCommand=start-hyprland -- --config /usr/share/sddm/hyprland.lua
